<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AOI - BC 25 m DEM, summer P90, 24 h prevailing wind Fire Simulation Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}.leaflet-container{background:#f7f7f7}.panel{max-width:340px;font:14px/1.4 system-ui,sans-serif}.panel h1{font-size:16px;margin:0 0 6px}.legend{display:grid;grid-template-columns:18px 1fr;gap:4px 8px;align-items:center;margin-top:8px}.fuel-legend{grid-template-columns:16px 1fr 16px 1fr;font-size:12px}.legend-group{margin-top:8px}.legend-group summary{cursor:pointer;font-weight:700}.swatch{height:12px}
</style></head><body><main id="map" aria-label="AOI - BC 25 m DEM, summer P90, 24 h prevailing wind Cell2Fire burn probability map"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>window.FIRE_SIM_MAP={"metadata": {"name": "aoi-25m-bcdem-summer-p90-24h-prevailing", "display_name": "AOI - BC 25 m DEM, summer P90, 24 h prevailing wind", "completed_runs": 500, "requested_runs": 1028, "mean_burned_cells": 27036.8, "max_burned_cells": 75875, "cells_with_nonzero_probability": 278086, "maximum_probability": 0.298, "cell_size_m": 25.0, "analysis_crs": "EPSG:3005", "scenario": "AOI at 25 m with GeoBC CDED/TRIM-derived DEM; observed 20 August 2018 weather over 24 hours with speed-weighted prevailing summer wind direction; exhaustive 500 m ignition grid", "aggregation_run_limit": 500, "partial_aggregation": true}, "bounds": [[49.43557813056479, -117.67403344402493], [49.609990722735475, -117.34494529896699]], "tileMaxZoom": 12, "ignitionLabel": "Included ignition-grid points"};const cfg=window.FIRE_SIM_MAP;const map=L.map('map');map.fitBounds(cfg.bounds,{padding:[12,12]});const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const PlainGreyLayer=L.GridLayer.extend({createTile:()=>{const tile=document.createElement('div');tile.style.background='#d9d9d9';return tile;}});const plainGrey=new PlainGreyLayer({tileSize:256});const noBasemap=L.layerGroup();const baseLayers={'OpenStreetMap':streets,'Plain grey':plainGrey,'No basemap':noBasemap};const fuel=L.tileLayer('tiles/fuel/{z}/{x}/{y}.png',{opacity:.58,maxNativeZoom:cfg.tileMaxZoom});const probability=L.tileLayer('tiles/probability/{z}/{x}/{y}.png',{opacity:.83,maxNativeZoom:cfg.tileMaxZoom}).addTo(map);const overlays={'FBP fuel types':fuel,'Burn probability':probability};const layerControl=L.control.layers(baseLayers,overlays,{collapsed:false}).addTo(map);fetch('data/ignitions.geojson').then(r=>r.json()).then(data=>{const ignitions=L.geoJSON(data,{pointToLayer:(_,latlng)=>L.circleMarker(latlng,{radius:3,color:'#422',weight:1,fillColor:'#f4c542',fillOpacity:.7}),onEachFeature:(feature,layer)=>layer.bindPopup(`<strong>${feature.properties.GRID_ID||''}</strong>`)});layerControl.addOverlay(ignitions,cfg.ignitionLabel);});L.control.scale({imperial:false}).addTo(map);const m=cfg.metadata;const note=L.control({position:'topright'});note.onAdd=()=>{const div=L.DomUtil.create('section','leaflet-control panel');const partial=m.partial_aggregation?`<p><strong>Partial aggregation:</strong> First ${m.completed_runs.toLocaleString()} of ${m.requested_runs.toLocaleString()} spatially ordered ignition runs. Not a full-AOI probability estimate.</p>`:'';div.innerHTML=`<h1>AOI - BC 25 m DEM, summer P90, 24 h prevailing wind</h1><div>${m.completed_runs.toLocaleString()} Cell2Fire runs · ${m.cell_size_m} m cells</div><div>${m.scenario}</div>${partial}<details class="legend-group" open><summary>Burn probability legend</summary><div class="legend"><span class="swatch" style="background:#ffffb2"></span><span>0.1–0.5%</span><span class="swatch" style="background:#fed976"></span><span>0.5–1%</span><span class="swatch" style="background:#feb24c"></span><span>1–2.5%</span><span class="swatch" style="background:#fd8d3c"></span><span>2.5–5%</span><span class="swatch" style="background:#f03b20"></span><span>5–10%</span><span class="swatch" style="background:#bd0026"></span><span>10–20%</span><span class="swatch" style="background:#480023"></span><span>20–30%</span></div></details><details class="legend-group"><summary>FBP [Fire Behaviour Prediction] fuel-type legend</summary><div class="legend fuel-legend"><span class="swatch" style="background:#226838"></span><span>C2 boreal spruce</span><span class="swatch" style="background:#82c691"></span><span>C3 mature pine</span><span class="swatch" style="background:#788c00"></span><span>C4 immature pine</span><span class="swatch" style="background:#d8a6e1"></span><span>C5 pine</span><span class="swatch" style="background:#6c00ed"></span><span>C7 Douglas-fir</span><span class="swatch" style="background:#b8ab7b"></span><span>D1 deciduous</span><span class="swatch" style="background:#ffffbe"></span><span>O1a grass</span><span class="swatch" style="background:#ffd281"></span><span>M1 15% conifer</span></div></details><p><strong>Planning scenario only.</strong> Not a live-fire forecast or operational decision product.</p>`;return div;};note.addTo(map);</script></body></html>
