<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SyncroSim Package 1 - 30 m fuel, 24 h P90, 1,000 m ignition grid, wind 355 degrees Fire Simulation Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body,#map{height:100%;margin:0}.leaflet-container{background:#f7f7f7}.panel{max-width:340px;font:14px/1.4 system-ui,sans-serif}.panel h1{font-size:16px;margin:0 0 6px}.legend{display:grid;grid-template-columns:18px 1fr;gap:4px 8px;align-items:center;margin-top:8px}.fuel-legend{grid-template-columns:16px 1fr 16px 1fr;font-size:12px}.legend-group{margin-top:8px}.legend-group summary{cursor:pointer;font-weight:700}.swatch{height:12px}
</style></head><body><main id="map" aria-label="SyncroSim Package 1 - 30 m fuel, 24 h P90, 1,000 m ignition grid, wind 355 degrees Cell2Fire simulation map"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>window.FIRE_SIM_MAP={"metadata": {"name": "aoi-30m-mrdem-fuel30-p90-24h-1000m-falls-tributary-wind355", "display_name": "SyncroSim Package 1 - 30 m fuel, 24 h P90, 1,000 m ignition grid, wind 355 degrees", "completed_runs": 257, "requested_runs": 257, "mean_burned_cells": 15904.824902723736, "max_burned_cells": 59133, "cells_with_nonzero_probability": 257410, "maximum_probability": 0.13618677042801555, "cell_size_m": 30.0, "analysis_crs": "EPSG:3005", "scenario": "Same Package 1 inputs as the 193 degree run, but with the 24 hourly wind direction overridden to 355 degrees from north; native 30 m NRCan FBP fuel with named Freshwater Atlas main streams, all lakes, and the selected main tributary to Falls Creek assigned water fuel code 102; 24 hourly Smallwood records from 20 August 2018, the observed day nearest the June-August 2016-2025 daily noon FWI P90.", "aggregation_run_limit": null, "partial_aggregation": false}, "bounds": [[49.43561752886596, -117.67395694915848], [49.60984034421234, -117.34476470239638]], "tileMaxZoom": 12, "ignitionLabel": "Ignition-grid points", "probabilityLabel": "Burn frequency", "hasGrowthIntervals": false};const cfg=window.FIRE_SIM_MAP;const map=L.map('map');map.fitBounds(cfg.bounds,{padding:[12,12]});const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'}).addTo(map);const streets=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});const PlainGreyLayer=L.GridLayer.extend({createTile:()=>{const tile=document.createElement('div');tile.style.background='#d9d9d9';return tile;}});const plainGrey=new PlainGreyLayer({tileSize:256});const noBasemap=L.layerGroup();const baseLayers={'Topographic (OpenTopoMap)':topo,'OpenStreetMap':streets,'Plain grey':plainGrey,'No basemap':noBasemap};const fuel=L.tileLayer('tiles/fuel/{z}/{x}/{y}.png',{opacity:.58,maxNativeZoom:cfg.tileMaxZoom});const probability=L.tileLayer('tiles/probability/{z}/{x}/{y}.png',{opacity:.83,maxNativeZoom:cfg.tileMaxZoom});const growth=cfg.hasGrowthIntervals?L.tileLayer('tiles/growth/{z}/{x}/{y}.png',{opacity:.86,maxNativeZoom:cfg.tileMaxZoom}).addTo(map):null;if(!growth)probability.addTo(map);const overlays={'FBP fuel types':fuel};overlays[cfg.probabilityLabel]=probability;if(growth)overlays['Fire growth - 12-hour intervals']=growth;const layerControl=L.control.layers(baseLayers,overlays,{collapsed:false}).addTo(map);fetch('data/ignitions.geojson').then(r=>r.json()).then(data=>{const ignitions=L.geoJSON(data,{pointToLayer:(_,latlng)=>L.circleMarker(latlng,{radius:5,color:'#422',weight:1,fillColor:'#f4c542',fillOpacity:.9}),onEachFeature:(feature,layer)=>layer.bindPopup(`<strong>${feature.properties.GRID_ID||''}</strong>`)});layerControl.addOverlay(ignitions,cfg.ignitionLabel);});L.control.scale({imperial:false}).addTo(map);const m=cfg.metadata;const note=L.control({position:'topright'});note.onAdd=()=>{const div=L.DomUtil.create('section','leaflet-control panel');const partial=m.partial_aggregation?`<p><strong>Partial aggregation:</strong> First ${m.completed_runs.toLocaleString()} of ${m.requested_runs.toLocaleString()} spatially ordered ignition runs. Not a full-AOI probability estimate.</p>`:'';div.innerHTML=`<h1>SyncroSim Package 1 - 30 m fuel, 24 h P90, 1,000 m ignition grid, wind 355 degrees</h1><div>${m.completed_runs.toLocaleString()} Cell2Fire run${m.completed_runs===1?'':'s'} · ${m.cell_size_m} m cells</div><div>${m.scenario}</div>${partial}<details class="legend-group"><summary>${cfg.probabilityLabel} legend</summary><div class="legend"><span class="swatch" style="background:#ffffb2"></span><span>0.1–0.5%</span><span class="swatch" style="background:#fed976"></span><span>0.5–1%</span><span class="swatch" style="background:#feb24c"></span><span>1–2.5%</span><span class="swatch" style="background:#fd8d3c"></span><span>2.5–5%</span><span class="swatch" style="background:#f03b20"></span><span>5–10%</span><span class="swatch" style="background:#bd0026"></span><span>10–20%</span><span class="swatch" style="background:#480023"></span><span>20–30%</span></div></details><details class="legend-group"><summary>FBP [Fire Behaviour Prediction] fuel-type legend</summary><div class="legend fuel-legend"><span class="swatch" style="background:#6e6e6e"></span><span>NoData / non-fuel [-9999]</span><span class="swatch" style="background:#226838"></span><span>C2 boreal spruce</span><span class="swatch" style="background:#82c691"></span><span>C3 mature pine</span><span class="swatch" style="background:#788c00"></span><span>C4 immature pine</span><span class="swatch" style="background:#d8a6e1"></span><span>C5 pine</span><span class="swatch" style="background:#6c00ed"></span><span>C7 Douglas-fir</span><span class="swatch" style="background:#787878"></span><span>Non-fuel [11]</span><span class="swatch" style="background:#b8ab7b"></span><span>D1 deciduous</span><span class="swatch" style="background:#ffffbe"></span><span>O1a grass</span><span class="swatch" style="background:#919191"></span><span>Non-fuel [101]</span><span class="swatch" style="background:#64cdeb"></span><span>Water / non-fuel [102]</span><span class="swatch" style="background:#646464"></span><span>Non-fuel [105]</span><span class="swatch" style="background:#ffd281"></span><span>M1 15% conifer</span></div></details><p><strong>Planning scenario only.</strong> Not a live-fire forecast or operational decision product.</p>`;return div;};note.addTo(map);</script></body></html>
